# Fichier de configuration de test WebServ
server {
    port = 8080;
    serv_name = localhost;
    error_page = 404 403 /errors/40x.html;
    error_page = 500 502 /errors/50x.html;
    client_max_body_size = 10M;
}

server {
    listen = 443;
    server_name = example.com;
    client_max_body_size = 500K;
    # Bloc location fictif pour tester la gestion des accolades imbriquées
    location / {
        root = /var/www/html;
    }
}
